<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXEL — AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070707;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

nav {
    height: 82px;
    padding: 0 6vw;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid #222;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 7px;
}

.back {
    color: #666;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
}

main {
    min-height: calc(100vh - 82px);

    display: flex;
    align-items: center;

    padding: 8vw 12vw;
}

.content {
    max-width: 850px;
}

.label {
    color: #555;
    font-size: 11px;
    letter-spacing: 4px;
}

h1 {
    font-size: clamp(65px, 10vw, 130px);
    letter-spacing: -7px;
    margin: 25px 0 35px;
}

.description {
    color: #888;
    font-size: 20px;
    line-height: 1.7;
    max-width: 700px;
}

.fields {
    margin-top: 35px;
    color: #555;
    font-size: 12px;
    letter-spacing: 2px;
}

.download {
    display: inline-block;

    margin-top: 55px;
    padding: 17px 27px;

    border: 1px solid #444;
    border-radius: 50px;

    color: white;
    text-decoration: none;

    font-size: 13px;
    letter-spacing: 1px;

    transition: .3s;
}

.download:hover {
    background: white;
    color: black;
}

</style>
</head>

<body>

<nav>

    <div class="logo">AXEL</div>

    <a href="index.html" class="back">
        ← BACK
    </a>

</nav>


<main>

    <div class="content">

        <div class="label">
            CV 02 / ARTIFICIAL INTELLIGENCE
        </div>

        <h1>AI</h1>

        <p class="description">
            My work in artificial intelligence focuses on computational
            thinking and building new algorithms — exploring new ways
            to represent, process and solve problems.
        </p>

        <div class="fields">
            ARTIFICIAL INTELLIGENCE &nbsp; / &nbsp;
            ALGORITHMS &nbsp; / &nbsp;
            COMPUTATION
        </div>

        <a href="ai-cv.pdf" class="download" download>
            DOWNLOAD MY CV ↓
        </a>

    </div>

</main>

</body>
</html>
